<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>

    <link rel="stylesheet" href="style.css">

    <!-- Police Google (optionnel mais recommandé pour un meilleur rendu) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="container">

        <!-- SECTION FORMULAIRE -->
        <section class="form-section">

            <h1>
                Ready to start your<br>
                success story?
            </h1>

            <p class="subtitle">
                Signup to our website and start leafing through your favorite literature today!
            </p>

            <form>

                <div class="form-group">
                    <label for="fullname">Full name</label>
                    <input type="text" id="fullname" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="janedoe@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="interest">Area of interest</label>
                    <select id="interest" required>
                        <option value="" disabled selected>Select an option</option>
                        <option>Literature</option>
                        <option>Programming</option>
                        <option>Business</option>
                        <option>Design</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </label>
                </div>

                <button type="submit">Sign up</button>

            </form>

        </section>

        <!-- SECTION IMAGE (CORRIGÉE : div au lieu de section) -->
        <div class="image-section">

            <img src="illustration.png" alt="Illustration woman reading book">

        </div>

    </main>

</body>

</html>
